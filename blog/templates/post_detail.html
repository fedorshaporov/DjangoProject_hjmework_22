{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p>{{ post.content }}</p>
<p><strong>Просмотры:</strong> {{ post.views }}</p>
<a href="{% url 'blog:blog_update' post.pk %}" class="btn btn-warning">Редактировать</a>
<form action="{% url 'blog:blog_delete' post.pk %}" method="post" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
</form>
<a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Назад к списку блогов</a>
{% endblock %}
